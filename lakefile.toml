name = "curve_symmetry"
version = "0.1.0"
defaultTargets = ["CurveSymmetry"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "CurveSymmetry"
srcDir = "lean"
moreLeanArgs = ["-DwarningAsError=true"]
# Flat module names are retained from the original port. The source audit
# checks that these roots and the aggregate imports cover every Lean source.
