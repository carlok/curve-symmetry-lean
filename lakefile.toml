  "RotationSupport",
  "Irreducibility",
  "RealLocus",
  "Elimination",
  "GeometricRotation",
  "RotationGroup",
  "Translation",
  "EuclideanCenter",
  "ChangeCenter",
  "DirectBound",
  "Reflection",
  "EuclideanParameters",
  "ReflectionBound",
  "FamilyQuadratic",
  "Blowup",
  "FamilyIrreducibility",
  "FamilyRealLocus",
  "FamilyRotations",
  "Fermat",
  "Sharpness",
  "RealEquation",
  "EqualityForm",
  "Normalization",
  "ExtremalClassification",
  "IsometryInterface",
  "CartesianCoordinates",
  "CartesianReal",
  "CartesianDescent",
  "DirectIsometries",
  "PaperBounds",
